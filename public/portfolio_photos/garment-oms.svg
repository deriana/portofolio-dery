    <text x="740" y="112" fill="#CBD5E1" font-family="sans-serif" font-size="12">24 Sep 2026</text>
    <rect x="880" y="97" width="85" height="22" rx="11" fill="#065F46" stroke="#10B981" stroke-width="1"/>
    <text x="895" y="112" fill="#6EE7B7" font-family="sans-serif" font-size="10" font-weight="700">COMPLETED</text>
