<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <linearGradient id="bgHub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#0b112c"/>
      <stop offset="100%" stop-color="#060919"/>
    </linearGradient>
    <linearGradient id="cardHub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111936"/>
      <stop offset="100%" stop-color="#0a0f24"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bgHub)"/>

  <!-- Top Navigation Bar -->
  <rect width="1280" height="64" fill="#070d22"/>
  <line x1="0" y1="64" x2="1280" y2="64" stroke="#18234d" stroke-width="1"/>

  <!-- Logo -->
  <rect x="24" y="16" width="32" height="32" rx="8" fill="#6366f1"/>
  <circle cx="40" cy="32" r="8" fill="none" stroke="#ffffff" stroke-width="2"/>
  <circle cx="40" cy="32" r="3" fill="#ffffff"/>
  <text x="68" y="38" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="800" letter-spacing="0.5">NATIONAL CORE DATA HUB</text>
  <rect x="330" y="21" width="155" height="22" rx="11" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="342" y="36" fill="#a5b4fc" font-family="sans-serif" font-size="10" font-weight="700">PUBLIC SECTOR ARCH</text>

  <!-- Search Input -->
  <rect x="520" y="16" width="360" height="32" rx="8" fill="#0d1633" stroke="#223163" stroke-width="1"/>
  <text x="540" y="36" fill="#64748b" font-family="sans-serif" font-size="12">Cari RPC Method, Proto Schema, Service Node...</text>

  <!-- Cluster Status Pill -->
  <rect x="910" y="17" width="200" height="30" rx="15" fill="#0f1f45" stroke="#3b82f6" stroke-width="1"/>
  <circle cx="926" cy="32" r="4" fill="#10b981"/>
  <text x="938" y="36" fill="#60a5fa" font-family="sans-serif" font-size="11" font-weight="700">gRPC Protobuf Mesh: 52k RPS</text>

  <rect x="1130" y="17" width="125" height="30" rx="8" fill="#0d1633" stroke="#223163" stroke-width="1"/>
  <text x="1145" y="36" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">DevOps / Admin</text>

  <!-- Left Sidebar -->
  <rect x="0" y="64" width="230" height="736" fill="#050a1c"/>
  <line x1="230" y1="64" x2="230" y2="800" stroke="#18234d" stroke-width="1"/>

  <g transform="translate(18, 88)">
    <rect x="0" y="0" width="194" height="40" rx="10" fill="#172147" stroke="#6366f1" stroke-width="1"/>
    <circle cx="20" cy="20" r="5" fill="#6366f1"/>
    <text x="36" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Jantung Data Topology</text>

    <text x="36" y="70" fill="#94a3b8" font-family="sans-serif" font-size="13">Service Registry (5/5)</text>
    <text x="36" y="115" fill="#94a3b8" font-family="sans-serif" font-size="13">gRPC Binary Streams</text>
    <text x="36" y="160" fill="#94a3b8" font-family="sans-serif" font-size="13">Protocol Buffer Schemas</text>
    <text x="36" y="205" fill="#94a3b8" font-family="sans-serif" font-size="13">Redis Distributed Cache</text>
    <text x="36" y="250" fill="#94a3b8" font-family="sans-serif" font-size="13">Data Integrity Checks</text>
    <text x="36" y="295" fill="#94a3b8" font-family="sans-serif" font-size="13">Cluster K8s Telemetry</text>
  </g>

  <!-- Page Header -->
  <text x="260" y="106" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="800">Jantung Data Pusat: Central Transaction &amp; Shared Data Hub</text>
  <text x="260" y="128" fill="#94a3b8" font-family="sans-serif" font-size="12">Orkestrasi pertukaran data biner ultra-cepat antar 5 microservice instansi pemerintahan via gRPC &amp; Protobuf</text>

  <!-- 4 Stat Summary Cards -->
  <g transform="translate(260, 148)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="235" height="96" rx="14" fill="url(#cardHub)" stroke="#223163" stroke-width="1"/>
    <text x="18" y="28" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">THROUGHPUT TRANSAKSI DATA</text>
    <text x="18" y="62" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="900">52,480 RPS</text>
    <text x="18" y="82" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="700">▲ Zero Packet Drop</text>

    <!-- Card 2 -->
    <rect x="255" y="0" width="235" height="96" rx="14" fill="url(#cardHub)" stroke="#223163" stroke-width="1"/>
    <text x="273" y="28" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">LATENSI INTER-SERVICE</text>
    <text x="273" y="62" fill="#38bdf8" font-family="sans-serif" font-size="24" font-weight="900">1.1 ms</text>
    <text x="273" y="82" fill="#67e8f9" font-family="sans-serif" font-size="11">gRPC HTTP/2 Multiplexing</text>

    <!-- Card 3 -->
    <rect x="510" y="0" width="235" height="96" rx="14" fill="url(#cardHub)" stroke="#223163" stroke-width="1"/>
    <text x="528" y="28" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">MICROSERVICE AKTIF</text>
    <text x="528" y="62" fill="#a78bfa" font-family="sans-serif" font-size="24" font-weight="900">5 / 5 Service</text>
    <text x="528" y="82" fill="#c4b5fd" font-family="sans-serif" font-size="11">100% Cluster Healthy</text>

    <!-- Card 4 -->
    <rect x="765" y="0" width="235" height="96" rx="14" fill="url(#cardHub)" stroke="#223163" stroke-width="1"/>
    <text x="783" y="28" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">PROTO SCHEMA INTEGRITY</text>
    <text x="783" y="62" fill="#10b981" font-family="sans-serif" font-size="24" font-weight="900">100% Valid</text>
    <text x="783" y="82" fill="#6ee7b7" font-family="sans-serif" font-size="11">Strict Contract Enforced</text>
  </g>

  <!-- Microservice Topology & Transaction Stream Grid -->
  <g transform="translate(260, 266)">
    <!-- Main Mesh Card -->
    <rect x="0" y="0" width="1000" height="500" rx="16" fill="url(#cardHub)" stroke="#223163" stroke-width="1"/>
    <text x="24" y="36" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="800">Topologi 5 Microservice &amp; Pertukaran Data Terpusat</text>
    <text x="24" y="56" fill="#64748b" font-family="sans-serif" font-size="11">Arsitektur gRPC mesh dengan Jantung Data Go sebagai single-point-of-truth sinkronisasi transaksi</text>

    <!-- Central Node (Jantung Data - Go Proto gRPC) -->
    <rect x="375" y="160" width="250" height="110" rx="16" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
    <circle cx="410" cy="200" r="14" fill="#6366f1"/>
    <text x="403" y="206" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="900">GO</text>
    <text x="435" y="196" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="800">JANTUNG DATA PUSAT</text>
    <text x="435" y="214" fill="#a5b4fc" font-family="sans-serif" font-size="11" font-weight="700">Core gRPC Exchange Engine</text>
    <text x="400" y="250" fill="#38bdf8" font-family="monospace" font-size="10">Proto v3 · Redis Cache-Aside · 1.1ms</text>

    <!-- Outer Service Nodes -->
    <!-- Service 1: HRIS Kepegawaian (Java) -->
    <line x1="220" y1="120" x2="375" y2="185" stroke="#6366f1" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="50" y="80" width="210" height="76" rx="12" fill="#0f1938" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="68" y="108" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="800">Service 1: HRIS Pegawai</text>
    <text x="68" y="126" fill="#93c5fd" font-family="sans-serif" font-size="11">Backend: Java (Spring Boot)</text>
    <rect x="68" y="134" width="70" height="16" rx="8" fill="#064e3b"/>
    <text x="78" y="146" fill="#6ee7b7" font-family="sans-serif" font-size="9" font-weight="700">SYNCED (RPC)</text>

    <!-- Service 2: Layanan Fiskal &amp; Anggaran -->
    <line x1="780" y1="120" x2="625" y2="185" stroke="#6366f1" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="740" y="80" width="210" height="76" rx="12" fill="#0f1938" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="758" y="108" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="800">Service 2: Layanan Fiskal</text>
    <text x="758" y="126" fill="#93c5fd" font-family="sans-serif" font-size="11">Budgeting &amp; Realisasi Dana</text>
    <rect x="758" y="134" width="70" height="16" rx="8" fill="#064e3b"/>
    <text x="768" y="146" fill="#6ee7b7" font-family="sans-serif" font-size="9" font-weight="700">SYNCED (RPC)</text>

    <!-- Service 3: Registri Kependudukan / Citizen -->
    <line x1="220" y1="310" x2="375" y2="245" stroke="#6366f1" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="50" y="270" width="210" height="76" rx="12" fill="#0f1938" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="68" y="298" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="800">Service 3: Registri Publik</text>
    <text x="68" y="316" fill="#93c5fd" font-family="sans-serif" font-size="11">Verifikasi Identitas Terpadu</text>
    <rect x="68" y="324" width="70" height="16" rx="8" fill="#064e3b"/>
    <text x="78" y="336" fill="#6ee7b7" font-family="sans-serif" font-size="9" font-weight="700">SYNCED (RPC)</text>

    <!-- Service 4: Vault Dokumen &amp; Arsip -->
    <line x1="780" y1="310" x2="625" y2="245" stroke="#6366f1" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="740" y="270" width="210" height="76" rx="12" fill="#0f1938" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="758" y="298" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="800">Service 4: Dokumen Vault</text>
    <text x="758" y="316" fill="#93c5fd" font-family="sans-serif" font-size="11">Tanda Tangan Digital BSSN</text>
    <rect x="758" y="324" width="70" height="16" rx="8" fill="#064e3b"/>
    <text x="768" y="336" fill="#6ee7b7" font-family="sans-serif" font-size="9" font-weight="700">SYNCED (RPC)</text>

    <!-- Service 5: Audit &amp; Event Stream Log -->
    <line x1="500" y1="360" x2="500" y2="270" stroke="#6366f1" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="395" y="360" width="210" height="68" rx="12" fill="#0f1938" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="413" y="388" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="800">Service 5: Event Audit Log</text>
    <text x="413" y="406" fill="#93c5fd" font-family="sans-serif" font-size="11">Immutable Traceability Hub</text>

    <!-- Bottom Telemetry Strip -->
    <rect x="24" y="450" width="952" height="34" rx="8" fill="#070e24"/>
    <text x="40" y="472" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700">PROTOBUF REGISTRY:</text>
    <text x="180" y="472" fill="#38bdf8" font-family="monospace" font-size="11">hub.v1.TransactionService/SyncSharedData (gRPC Stream: Healthy)</text>
    <text x="770" y="472" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="700">K8s Cluster: 5/5 Healthy</text>
  </g>
</svg>
